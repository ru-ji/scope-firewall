# Two gates.
# tests:    the tooling itself (contract checker, lanes, ledgers, environments). Must always be green.
# contract: no regression. Every contract rule that passes on the base commit must still pass, so a hotfix can ship
#           while another minor bug waits for its patch. Open failures are listed, not blocking.
#           Make both jobs required in Settings > Branches > main > Require status checks, plus 1 required review.
name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: for t in tests/test_*.py; do echo "== $t"; python3 "$t" || exit 1; done
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: No regression against the base commit
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "$BASE:demo-app/app.py" > /tmp/base_app.py 2>/dev/null || git show HEAD~1:demo-app/app.py > /tmp/base_app.py
          python3 tools/contract.py regress /tmp/base_app.py demo-app/app.py
      - name: Open contract failures (informational)
        run: |
          python3 demo-app/app.py &
          for i in $(seq 20); do python3 -c "import socket; socket.create_connection(('127.0.0.1', 8080), 1)" 2>/dev/null && break; sleep 0.5; done
          python3 tools/contract.py check http://127.0.0.1:8080 || true
