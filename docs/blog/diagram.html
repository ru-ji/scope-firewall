<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{width:1060px;height:330px;position:relative;overflow:hidden;font-family:Charter,"Iowan Old Style",Georgia,serif;color:#1a1a1a}
.card{position:absolute;inset:0;background:#faf8f3;border-radius:14px}
svg{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.node b{display:block;font-size:22px;font-weight:600;letter-spacing:-.005em}
.node i{display:block;font-size:15px;color:#7a7568;margin-top:3px}
.ring{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:1.5px solid #1a1a1a;border-radius:50%;display:grid;place-items:center;background:#faf8f3}
.ring span{width:24px;height:24px;background:#1a1a1a;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center}
.cap{position:absolute;transform:translate(-50%,-50%);font-size:14px;font-style:italic;color:#7a7568;background:#faf8f3;padding:0 6px}
.num{position:absolute;left:36px;top:26px;font-size:13px;letter-spacing:.18em;color:#7a7568;font-family:-apple-system,system-ui,sans-serif;font-weight:600}
</style></head><body><div class="card"></div>
<div class="num">FIG. 1 · ONE CLIENT MESSAGE, START TO FINISH</div>
<svg width="1060" height="330"></svg><div id="n"></div>
<script>
const S=n=>`https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/${n}.svg`;
// id, x, y, logo or [title, note]
const N=[["msg",70,180,"discord"],["rec",205,180,["Reception","splits it"]],
["ver",350,115,"claude"],["con",350,245,"openai"],["cmp",490,180,["Compare","both agree"]],
["fix",640,115,["Hotfix","fix now"]],["lead",800,115,["Tech lead","approves"]],["prod",975,115,["Production",""]],
["quote",655,245,["Next version","planned"]],["upd",860,245,["Client update","with reasons"]]];
const E=[["msg","rec"],["rec","ver"],["rec","con"],["ver","cmp"],["con","cmp"],["cmp","fix","defect"],["cmp","quote","feature"],["fix","lead"],["lead","prod"],["quote","upd"]];
const P={},n=document.getElementById("n"),svg=document.querySelector("svg");
for(const [id,x,y,v] of N){P[id]=[x,y];
 n.insertAdjacentHTML("beforeend",typeof v==="string"
  ?`<div class="ring" id="${id}" style="left:${x}px;top:${y}px"><span style="-webkit-mask-image:url(${S(v)})"></span></div>`
  :`<div class="node" id="${id}" style="left:${x}px;top:${y+8}px"><b>${v[0]}</b>${v[1]?`<i>${v[1]}</i>`:""}</div>`);}
const half=id=>{const e=document.getElementById(id);return e.classList.contains("ring")?30:e.offsetWidth/2+12};
window.addEventListener("load",()=>setTimeout(()=>{for(const [a,b,lab] of E){const [x1,y1]=P[a],[x2,y2]=P[b],sx=x1+half(a),ex=x2-half(b),mx=(sx+ex)/2;
 svg.insertAdjacentHTML("beforeend",`<path d="M${sx} ${y1} C${mx} ${y1} ${mx} ${y2} ${ex} ${y2}" stroke="#1a1a1a" stroke-width="1.3" fill="none"/>
 <circle cx="${ex}" cy="${y2}" r="3" fill="#1a1a1a"/>`);
 if(lab)n.insertAdjacentHTML("beforeend",`<div class="cap" style="left:${mx}px;top:${(y1+y2)/2}px">${lab}</div>`);}},400));
</script></body></html>
