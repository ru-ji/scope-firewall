<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons@5.0.5/css/framework7-icons.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{width:1760px;height:640px;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;position:relative;overflow:hidden}
svg.edges{position:absolute;inset:0}
.node{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;background:#fff;border:1px solid #e6e7ee;border-radius:22px;
 display:grid;place-items:center;box-shadow:0 6px 18px rgba(30,32,60,.08)}
.node .f7-icons{font-size:38px}
.logo{width:40px;height:40px;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center}
.cap{position:absolute;width:190px;margin-left:-95px;text-align:center}
.cap b{display:block;font-size:15px;font-weight:600;color:#23252f}
.cap small{display:block;font-size:12.5px;color:#9093a3;margin-top:3px}
.tag{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;color:#9093a3;background:#fff;padding:1px 6px;border-radius:8px}
</style></head><body>
<svg class="edges" width="1760" height="640"></svg>
<div id="n"></div>
<script>
const S=n=>`https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/${n}.svg`;
// id, x, y, icon (f7 name or logo:simple-icon), color, title, detail
const N=[
["brief",80,110,"logo:discord","#5865F2","Client brief","#planning"],
["draft",270,110,"doc_checkmark_fill","#7c5cff","Planner","drafts the rules"],
["sign",460,110,"signature","#f08a24","Signature","in the chat"],
["dates",650,110,"calendar_badge_plus","#22a06b","Dates","working days + tests"],
["dev",840,110,"hammer_fill","#f08a24","Developer","corrects the estimate"],
["pm",1030,110,"checkmark_seal_fill","#f08a24","Project manager","accepts the date"],
["msg",80,400,"logo:discord","#5865F2","Client message","#client-requests"],
["rec",270,400,"arrow_branch","#7c5cff","Reception","one sheet per request"],
["ver",460,310,"logo:claude","#d97757","Verifier","Claude Code"],
["con",460,490,"logo:openai","#111111","Contradictor","Codex, blind"],
["cmp",650,400,"arrow_merge","#22a06b","Compare","both must agree"],
["fix",840,310,"bolt_fill","#e5484d","Hotfix","free"],
["stage",1030,310,"cube_box_fill","#22a06b","Staging","contract checked"],
["lead",1220,310,"person_crop_circle_fill_badge_checkmark","#f08a24","Tech lead","only one who promotes"],
["prod",1410,230,"rocket_fill","#22a06b","Production","Allow in chat"],
["hold",1410,400,"hand_raised_fill","#e5484d","Refused","anyone else"],
["quote",840,490,"tag_fill","#22a06b","Quote","next version"],
["upd",1030,490,"paperplane_fill","#f08a24","Client update","dates + reasons"]];
const E=[["brief","draft"],["draft","sign"],["sign","dates"],["dates","dev"],["dev","pm"],
["msg","rec"],["rec","ver"],["rec","con"],["ver","cmp"],["con","cmp"],["cmp","fix","defect"],["cmp","quote","feature"],
["fix","stage"],["stage","lead"],["lead","prod"],["lead","hold"],["quote","upd"]];
const P={},n=document.getElementById("n"),svg=document.querySelector("svg.edges");
for(const [id,x,y,ic,c,t,s] of N){P[id]=[x,y];
 const inner=ic.startsWith("logo:")?`<div class="logo" style="background:${c};-webkit-mask-image:url(${S(ic.slice(5))})"></div>`:`<i class="f7-icons" style="color:${c}">${ic}</i>`;
 n.insertAdjacentHTML("beforeend",`<div class="node" style="left:${x}px;top:${y}px">${inner}</div><div class="cap" style="left:${x}px;top:${y+54}px"><b>${t}</b><small>${s}</small></div>`);}
for(const [a,b,lab] of E){const [x1,y1]=P[a],[x2,y2]=P[b],sx=x1+46,ex=x2-50,mx=(sx+ex)/2;
 svg.insertAdjacentHTML("beforeend",`<path d="M${sx} ${y1} C${mx} ${y1} ${mx} ${y2} ${ex} ${y2}" stroke="#c4c6d3" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M${ex-6} ${y2-5} L${ex} ${y2} L${ex-6} ${y2+5}" stroke="#c4c6d3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
 if(lab)n.insertAdjacentHTML("beforeend",`<div class="tag" style="left:${mx}px;top:${(y1+y2)/2}px">${lab}</div>`);}
</script></body></html>
