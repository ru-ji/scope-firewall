<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1800px;height:760px;font-family:"Open Sans",-apple-system,system-ui,sans-serif;position:relative;overflow:hidden;
 background-color:#f8f8fc;background-image:linear-gradient(#e9e9f5 1px,transparent 1px),linear-gradient(90deg,#e9e9f5 1px,transparent 1px);background-size:44px 44px}
svg.edges{position:absolute;inset:0}
.node{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;background:#fff;border:1.5px dashed;border-radius:18px;display:grid;place-items:center}
.node.trigger{border-radius:44px 18px 18px 44px}
.node i.ph-fill{font-size:42px}
.in{position:absolute;left:-5px;top:35px;width:8px;height:18px;background:#7c7c84;border-radius:2px}
.out{position:absolute;right:-11px;width:20px;height:20px;border-radius:50%;background:#55555c}
.cap{position:absolute;width:200px;margin-left:-100px;text-align:center}
.cap b{display:block;font-size:15.5px;font-weight:500;color:#2d2e36}
.cap small{display:block;font-size:12px;color:#8a8b94;margin-top:3px}
.branch{position:absolute;font-size:11px;color:#6b6c75}
.plus{position:absolute;right:28px;top:22px;width:44px;height:44px;border-radius:50%;background:#ff6d5a;color:#fff;font-size:30px;display:grid;place-items:center;font-weight:300}
.zoom{position:absolute;left:22px;bottom:22px;display:flex;gap:6px}
.zoom span{width:34px;height:34px;background:#fff;border-radius:8px;display:grid;place-items:center;color:#55555c;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.run{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#ff6d5a;color:#fff;font-size:14px;font-weight:600;border-radius:22px;padding:10px 20px;display:flex;align-items:center;gap:8px}
.title{position:absolute;left:28px;top:24px;font-size:16px;color:#55555c}
.title b{color:#2d2e36;font-weight:600}
</style></head><body>
<div class="title"><b>Scope Firewall</b> &nbsp;·&nbsp; client project, from kickoff to delivery</div>
<div class="plus">+</div>
<svg class="edges" width="1800" height="760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3b4256"/></marker></defs></svg>
<div id="nodes"></div>
<div class="zoom"><span><i class="ph-fill ph-magnifying-glass-plus"></i></span><span><i class="ph-fill ph-magnifying-glass-minus"></i></span></div>
<div class="run"><i class="ph-fill ph-play-circle"></i>Execute Workflow</div>
<script>
// id, x, y, icon, color, border, title, parameter, trigger
const N=[
["brief",110,170,"discord-logo","#5865F2","#5865F2","Client brief","#planning",1],
["draft",300,170,"file-text","#6d4aff","#6d4aff","Planner","draft: contract rules"],
["sign",490,170,"pen-nib","#e8792b","#e8792b","Sign contract","approval: in chat"],
["dates",680,170,"calendar-check","#1f9d55","#1f9d55","Propose dates","working days + tests"],
["dev",870,170,"code","#e8792b","#e8792b","Developer","estimate: F5 is M"],
["pm",1060,170,"seal-check","#e8792b","#e8792b","Project manager","accept: date"],
["msg",110,440,"discord-logo","#5865F2","#5865F2","Client message","#client-requests",1],
["rec",300,440,"git-fork","#6d4aff","#6d4aff","Reception","split: one sheet per request"],
["ver",490,350,"shield-check","#d97757","#d97757","Verifier","Claude Code · contract.py"],
["con",490,530,"open-ai-logo","#111","#555","Contradictor","Codex · blind room"],
["cmp",690,440,"signpost","#2e9e3e","#2e9e3e","Compare verdicts","compare.py"],
["fix",890,350,"lightning","#e5484d","#e5484d","Hotfix","defect: free"],
["stage",1080,350,"hard-drives","#1f9d55","#1f9d55","Staging","deploy: contract checked"],
["lead",1270,350,"signpost","#2e9e3e","#2e9e3e","Tech lead?","roles: team.json"],
["prod",1470,290,"rocket-launch","#1f9d55","#1f9d55","Production","Allow in chat"],
["hold",1470,440,"hand-palm","#e5484d","#e5484d","Refuse","developer cannot promote"],
["quote",890,530,"receipt","#1f9d55","#1f9d55","Quote","feature: next version"],
["upd",1080,530,"paper-plane-tilt","#e8792b","#e8792b","Client update","dates + every reason"]];
const E=[["brief","draft"],["draft","sign"],["sign","dates"],["dates","dev"],["dev","pm"],
["msg","rec"],["rec","ver"],["rec","con"],["ver","cmp"],["con","cmp"],["cmp","fix","t"],["cmp","quote","f"],
["fix","stage"],["stage","lead"],["lead","prod","t"],["lead","hold","f"],["quote","upd"]];
const P={},box=document.getElementById("nodes"),svg=document.querySelector("svg.edges");
const ifs=new Set(["cmp","lead"]);
for(const [id,x,y,ic,col,bd,t,p,tr] of N){P[id]=[x,y];
 const outs=ifs.has(id)?`<i class="out" style="top:18px"></i><i class="out" style="top:50px"></i>`:`<i class="out" style="top:34px"></i>`;
 box.insertAdjacentHTML("beforeend",`<div class="node ${tr?"trigger":""}" style="left:${x}px;top:${y}px;border-color:${bd}">
 <i class="ph-fill ph-${ic}" style="color:${col}"></i>${tr?"":'<i class="in"></i>'}${outs}</div>
 <div class="cap" style="left:${x}px;top:${y+52}px"><b>${t}</b><small>${p}</small></div>`);
 if(ifs.has(id))box.insertAdjacentHTML("beforeend",`<div class="branch" style="left:${x+50}px;top:${y-46}px">${id=="cmp"?"defect":"true"}</div>
 <div class="branch" style="left:${x+50}px;top:${y+30}px">${id=="cmp"?"feature":"false"}</div>`);}
for(const [a,b,br] of E){const [x1,y1]=P[a],[x2,y2]=P[b];
 const sy=y1+(br=="t"?-16:br=="f"?16:0),sx=x1+54,ex=x2-50,mx=(sx+ex)/2;
 svg.insertAdjacentHTML("beforeend",`<path d="M${sx} ${sy} C${mx} ${sy} ${mx} ${y2} ${ex} ${y2}" stroke="#3b4256" stroke-width="2" fill="none" marker-end="url(#a)"/>`);}
</script></body></html>
